{% extends "accounts/base.html" %}

{% block content %}
<div class="container" style="max-width:600px;margin:50px auto;">

    <h2>Delete User</h2>

    <p>Are you sure you want to delete user
       <strong>{{ user.username }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit"
                style="background:#dc3545;color:white;padding:10px 20px;border:0;border-radius:6px;">
            Confirm Delete
        </button>

        <a href="{% url 'user_list' %}">Cancel</a>
    </form>

</div>
{% endblock %}
