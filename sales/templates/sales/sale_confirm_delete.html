<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Sale</title>
    <style>
        body { background: #f4f6fb; font-family: Arial, sans-serif; }
        .box { max-width: 500px; margin: 100px auto; background: white; padding: 35px; border-radius: 12px; text-align: center; }
        button { background: #e04444; color: white; padding: 12px 22px; border: none; border-radius: 7px; cursor: pointer; }
        a { color: #267eff; text-decoration: none; margin-left: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Delete Sale?</h2>

    <p>Are you sure you want to delete this sale record?</p>
    <p><strong>{{ sale.property.title }}</strong></p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'sale_list' %}">Cancel</a>
    </form>
</div>

</body>
</html>
